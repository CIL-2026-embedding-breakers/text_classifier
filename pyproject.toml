[project]
name = "text-classifier"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "scipy",
    "pillow",
    "jupyterlab",
    "notebook",
    "matplotlib",
    "requests",
    "pyyaml",
    # --- Linux cluster versions ---
    "torch>=2.7 ; sys_platform == 'linux'",
    "torchvision>=0.22 ; sys_platform == 'linux'",
    "triton==3.6.0 ; sys_platform == 'linux'",
    # --- macOS (Apple Silicon / MPS) versions ---
    "torch==2.11.0 ; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "torchvision==0.26.0 ; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "spacy>=3.7",
    "ipykernel>=7.2.0",
    "emoji>=2.15.0",
    "emosent-py>=0.1.7",
    "seaborn>=0.13.2",
    "transformers>=5.8.1",
    "huggingface-hub>=1.14.0",
    "datasets>=4.8.5",
    "peft>=0.19.1",
    "wandb>=0.27.0",
    "lingua-language-detector>=2.1.1",
    "sentencepiece>=0.2.1",
    "en-core-web-sm",
    "de-core-news-sm",
]

[dependency-groups]

[tool.uv]
required-environments = [
    "sys_platform == 'linux'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'"
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux'" }
]
torchvision = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux'" }
]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
de-core-news-sm = { url = "https://github.com/explosion/spacy-models/releases/download/de_core_news_sm-3.8.0/de_core_news_sm-3.8.0-py3-none-any.whl" }
